<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Songwriter Explorer — 作詞作曲者から広がる音楽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">MusicBrainz Powered</p>
      <h1>Songwriter Explorer</h1>
      <p class="lead">好きな曲から、作詞・作曲した人が手がけた他の楽曲を見つけよう。</p>
      <form id="search-form" class="search-form" autocomplete="off">
        <div class="search-fields">
          <div class="search-field">
            <svg class="icon-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="query" name="query" type="text" placeholder="曲名（例: Pretender）" required>
          </div>
          <div class="search-field">
            <svg class="icon-search" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4 0-7 2-7 4v1h14v-1c0-2-3-4-7-4z" fill="currentColor"/></svg>
            <input id="artist" name="artist" type="text" placeholder="アーティスト名（任意）">
          </div>
        </div>
        <button type="submit" class="btn-primary">検索</button>
      </form>
      <p class="hint">※ 曲名＋アーティスト名で絞り込めます。データは MusicBrainz より取得。</p>
    </div>
  </header>

  <main class="container">
    <section id="status" class="status" aria-live="polite"></section>

    <section id="results" class="section hidden">
      <div class="section-head">
        <h2>曲の候補</h2>
        <p class="section-sub">調べたい曲を選んでください</p>
      </div>
      <div id="recording-list" class="card-grid"></div>
    </section>

    <section id="creators" class="section hidden">
      <div class="section-head">
        <h2>作詞・作曲</h2>
        <p id="selected-track" class="section-sub"></p>
      </div>
      <div id="creator-list" class="creator-list"></div>
    </section>

    <section id="works" class="section hidden">
      <div class="section-head">
        <h2>この人の他の作品</h2>
        <p id="works-sub" class="section-sub"></p>
      </div>
      <div id="works-list" class="works-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Data provided by <a href="https://musicbrainz.org/" target="_blank" rel="noopener">MusicBrainz</a> · Free & Open Music Encyclopedia</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
